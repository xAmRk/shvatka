<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Задания ивента</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #18222d);
      --card-bg: var(--tg-theme-secondary-bg-color, #222f3e);
      --text: var(--tg-theme-text-color, #ffffff);
      --hint: var(--tg-theme-hint-color, #7f8c8d);
      --accent: var(--tg-theme-button-color, #2e86de);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; padding-bottom: 30px; }

    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .header p { font-size: 13px; color: var(--hint); }

    .badge {
      display: inline-block;
      background: rgba(46, 134, 222, 0.2);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 8px;
    }

    .quest-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .quest-card:active { transform: scale(0.98); }

    .quest-head { display: flex; justify-content: space-between; align-items: center; }
    .quest-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .chevron { transition: transform 0.2s ease; font-size: 12px; color: var(--hint); }
    .quest-card.open .chevron { transform: rotate(180deg); }

    .quest-details {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 14px;
      line-height: 1.4;
    }
    .quest-card.open .quest-details { display: block; }

    .row { margin-bottom: 10px; }
    .label { color: var(--hint); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
    .reward { color: #f1c40f; font-weight: 600; }
    .tip-box {
      background: rgba(255,255,255,0.05);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--hint);
      border-left: 3px solid var(--accent);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>⚔️ Задания недели</h1>
    <p>Каждую неделю список обновляется</p>
    <div class="badge">Циклический ивент</div>
  </div>

  <div id="quests-container"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Список заданий: названия, цели, награды и советы
    const quests = [
      {
        icon: "⚔️",
        title: "Задание 1: Зачистка",
        desc: "Победите 10 монстров любого типа в базовых локациях.",
        reward: "🪙 1 000 Золота + 100 Опыта",
        tip: "Легче всего закрыть в первой локации без лишней траты ресурсов."
      },
      {
        icon: "💎",
        title: "Задание 2: Сбор ресурсов",
        desc: "Соберите 5 единиц редких материалов или кристаллов.",
        reward: "💎 25 Кристаллов",
        tip: "Ресурсы на карте восстанавливаются каждые 30 минут."
      },
      {
        icon: "🤝",
        title: "Задание 3: Взаимодействие",
        desc: "Помогите соклановцу или проведите 1 совместный бой.",
        reward: "🎁 Наградной сундук гильдии",
        tip: "Засчитывается даже быстрый тренировочный поединок."
      }
    ];

    const container = document.getElementById("quests-container");

    quests.forEach(q => {
      const card = document.createElement("div");
      card.className = "quest-card";
      card.innerHTML = `
        <div class="quest-head">
          <div class="quest-title"><span>${q.icon}</span> ${q.title}</div>
          <span class="chevron">▼</span>
        </div>
        <div class="quest-details">
          <div class="row">
            <div class="label">Цель:</div>
            <div>${q.desc}</div>
          </div>
          <div class="row">
            <div class="label">Награда:</div>
            <div class="reward">${q.reward}</div>
          </div>
          <div class="tip-box">💡 <b>Совет:</b> ${q.tip}</div>
        </div>
      `;

      card.addEventListener("click", () => {
        card.classList.toggle("open");
        if (tg.HapticFeedback) {
          tg.HapticFeedback.impactOccurred("light");
        }
      });

      container.appendChild(card);
    });
  </script>
</body>
</html>
